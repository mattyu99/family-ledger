<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google 帳號綁定 - 甜心記帳本</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (!window.supabase) {
      document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #FFF0F5;
      color: #1F2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.1), 0 8px 10px -6px rgba(225, 29, 72, 0.05);
      border: 1.5px solid #FFE4E6;
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: #FFE4E6;
    }
    .icon-box.success {
      background: #DCFCE7;
    }
    .icon-box.error {
      background: #FEE2E2;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1F2937;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 14px;
      color: #6B7280;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #E11D48;
      margin-bottom: 20px;
    }
    .info-card {
      background: #F9FAFB;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      margin-bottom: 24px;
      border: 1px solid #E5E7EB;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13.5px;
    }
    .info-label {
      color: #6B7280;
    }
    .info-val {
      font-weight: 600;
      color: #111827;
      word-break: break-all;
    }
    .code-box {
      background: #FDF2F8;
      border: 2px dashed #F472B6;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .code-title {
      font-size: 12px;
      font-weight: 600;
      color: #BE185D;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .code-digits {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #E11D48;
      font-family: monospace;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #E11D48 0%, #BE123C 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-secondary {
      background: #F3F4F6;
      color: #374151;
      box-shadow: none;
      margin-top: 10px;
      font-size: 14px;
      padding: 12px;
    }
    .sub-hint {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 14px;
      line-height: 1.4;
    }
    .tip-card {
      margin-top: 16px;
      background: #FFF7ED;
      border: 1px solid #FFEDD5;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: #9A3412;
      line-height: 1.5;
      text-align: left;
    }
    .spinner {
      border: 3px solid #F3F4F6;
      border-top: 3px solid #E11D48;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card" id="appCard">
    <div class="icon-box" id="statusIcon">
      <div class="spinner" id="loadingSpinner"></div>
    </div>
    <h1 id="statusTitle">正在處理 Google 授權...</h1>
    <p class="desc" id="statusDesc">請稍候，系統正在安全驗證您的身分與公帳權限</p>

    <div id="contentArea"></div>

    <div id="actionArea" style="display: none;">
      <div class="tip-card" id="userGuideHint" style="margin-top: 0; margin-bottom: 14px;">
        <div id="guideHintTitle" style="font-size: 14.5px; font-weight: 700; margin-bottom: 6px; color: #9A3412;">📱 如何切換回「甜心記帳本」？</div>
        <div id="guideHintDesc" style="font-size: 13.5px; line-height: 1.6; color: #7C2D12;">
          從手機螢幕底部<strong>「向上輕滑」</strong>即可切換回記帳本 App，身分狀態已即時同步！
        </div>
      </div>
      <button class="btn btn-secondary" onclick="tryCloseOrBack()">✕ 關閉此分頁</button>
    </div>
  </div>

  <script>
    let currentEmail = '';

    function tryCloseOrBack() {
      try { window.close(); } catch (e) {}
      if (window.history && window.history.length > 2) {
        window.history.go(-2);
      }
    }

    function showError(msg) {
      const statusIcon = document.getElementById('statusIcon');
      if (statusIcon) {
        statusIcon.className = 'icon-box error';
        statusIcon.innerHTML = '⚠️';
      }
      const statusTitle = document.getElementById('statusTitle');
      if (statusTitle) {
        statusTitle.innerText = '授權或綁定未完成';
      }
      const statusDesc = document.getElementById('statusDesc');
      if (statusDesc) {
        statusDesc.innerText = msg;
      }
      const contentArea = document.getElementById('contentArea');
      if (contentArea) {
        contentArea.innerHTML = '';
      }
      const actionArea = document.getElementById('actionArea');
      if (actionArea) {
        actionArea.style.display = 'block';
      }
    }

    // 全域未捕捉錯誤防護
    window.addEventListener('error', function(e) {
      console.warn('全域捕獲錯誤:', e);
      showError('授權處理發生異常：' + (e.message || '請返回 App 重試'));
    });

    // 優先立即檢測 URL 是否為取消或錯誤（0 毫秒極速反應，不依賴任何外部庫）
    const searchStr = window.location.search || '';
    const hashStr = window.location.hash || '';
    const urlParams = new URLSearchParams(searchStr);
    const hashParams = hashStr ? new URLSearchParams(hashStr.substring(1)) : null;

    const isCancelOrError = urlParams.get('error') ||
                            urlParams.get('error_description') ||
                            searchStr.includes('error=access_denied') ||
                            hashStr.includes('error=access_denied') ||
                            hashParams?.get('error') ||
                            hashParams?.get('error_description');

    if (isCancelOrError) {
      showError('您已取消 Google 授權，未進行任何身分變更。請返回 App 重新開啟。');
    } else {
      // 正常授權流程：初始化 Supabase 並處理 session
      const SUPABASE_URL = 'https://babpppaxzszieropeouh.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_nxHZUg651sBAJ387bZgZIQ_GuEfpAuZ';

      if (!window.supabase || !window.supabase.createClient) {
        showError('驗證核心元件載入逾時，請確認網路連線正常後返回 App 重試。');
      } else {
        try {
          const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              persistSession: true,
              detectSessionInUrl: true,
            }
          });

          async function handleAuth() {
            try {
              let action = urlParams.get('action') || 'bind_google';
              let profileId = urlParams.get('profile_id');
              let ledgerId = urlParams.get('ledger_id');
              let displayName = urlParams.get('display_name') || '家庭成員';

              if (window.location.hash) {
                const hp = new URLSearchParams(window.location.hash.substring(1));
                if (!profileId && hp.get('profile_id')) profileId = hp.get('profile_id');
                if (!action && hp.get('action')) action = hp.get('action');
              }

              // 取得使用者 Session
              const { data: { session }, error: sessionError } = await supabase.auth.getSession();
              if (sessionError) throw sessionError;

              if (!session || !session.user) {
                supabase.auth.onAuthStateChange(async (event, newSession) => {
                  if (newSession && newSession.user) {
                    processUserSession(newSession.user, action, profileId, ledgerId, displayName);
                  }
                });
                return;
              }

              await processUserSession(session.user, action, profileId, ledgerId, displayName);
            } catch (err) {
              console.error('OAuth 授權異常:', err);
              showError(err.message || '授權處理過程中發生錯誤，請返回 APP 重試。');
            }
          }

          async function processUserSession(user, action, profileId, ledgerId, displayName) {
            currentEmail = user.email || '';

            if (action === 'claim') {
              const { data: profiles, error: pErr } = await supabase
                .from('profiles')
                .select('*')
                .eq('auth_email', currentEmail.toLowerCase())
                .eq('is_locked', true);

              if (pErr || !profiles || profiles.length === 0) {
                showError('在雲端找不到綁定此 Google 帳號（' + currentEmail + '）的受保護稱謂。請確認是否使用相同的 Google 信箱。');
                return;
              }

              const matchedProfile = profiles[0];
              const claimCode = Math.floor(100000 + Math.random() * 900000).toString();
              const expiresAt = new Date(Date.now() + 10 * 60 * 1000).toISOString();

              await supabase.from('profiles').update({
                claim_code: claimCode,
                claim_code_expires_at: expiresAt,
                updated_at: new Date().toISOString()
              }).eq('id', matchedProfile.id);

              showClaimSuccess(matchedProfile.display_name, currentEmail, claimCode);
            } else if (action === 'login') {
              // 1. 查詢所有鎖定給此 Google 帳號的成員稱謂（例如 智爸、倉鼠）
              const { data: boundProfiles } = await supabase
                .from('profiles')
                .select('id, display_name, avatar_url, ledger_id')
                .eq('auth_email', currentEmail.toLowerCase())
                .eq('is_locked', true);

              showLoginSuccess(currentEmail, boundProfiles || []);

              // 自動嘗試喚回原生 App
              setTimeout(() => {
                try {
                  window.location.href = `familyledger://auth-success?action=login&email=${encodeURIComponent(currentEmail)}`;
                } catch (e) {}
              }, 800);
            } else {
              // action === 'bind_google'
              let finalName = displayName;
              if (profileId) {
                // 優先從資料庫撈取此成員真實名稱，避免使用預設 fallback
                const { data: pData } = await supabase
                  .from('profiles')
                  .select('display_name')
                  .eq('id', profileId)
                  .maybeSingle();

                if (pData?.display_name) {
                  finalName = pData.display_name;
                }

                const { error: updateErr } = await supabase
                  .from('profiles')
                  .update({
                    auth_email: currentEmail.toLowerCase(),
                    auth_provider: 'google',
                    is_locked: true,
                    updated_at: new Date().toISOString()
                  })
                  .eq('id', profileId);

                if (updateErr) {
                  console.warn('更新 profile 失敗:', updateErr);
                }
              }

              showBindSuccess(finalName || '已綁定成員', currentEmail);

              // 自動嘗試喚回原生 App
              setTimeout(() => {
                try {
                  window.location.href = `familyledger://auth-success?action=bind_google&email=${encodeURIComponent(currentEmail)}`;
                } catch (e) {}
              }, 800);
            }
          }

          function showLoginSuccess(email, boundProfiles) {
            document.getElementById('statusIcon').className = 'icon-box success';
            document.getElementById('statusIcon').innerHTML = '🎉';
            document.getElementById('statusTitle').innerText = 'Google 帳號登入成功！';
            document.getElementById('statusDesc').innerText = '已安全驗證身分，名下的家庭公帳與稱謂已同步解鎖';

            let namesHtml = '';
            if (boundProfiles && boundProfiles.length > 0) {
              const uniqueNames = [...new Set(boundProfiles.map(p => `${p.avatar_url || '👤'} ${p.display_name}`))];
              namesHtml = uniqueNames.join('、');
            } else {
              namesHtml = '（登入成功，即將為您同步）';
            }

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
              <div class="badge" style="background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0;">🟢 帳號登入成功</div>
              <div class="info-card">
                <div class="info-row">
                  <span class="info-label">登入帳號</span>
                  <span class="info-val">${email}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">已配對稱謂</span>
                  <span class="info-val" style="color: #059669; font-weight: 700;">${namesHtml}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">帳號狀態</span>
                  <span class="info-val" style="color: #10B981;">✅ 已授權通行</span>
                </div>
              </div>
            `;

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = `
              <div class="tip-card" id="userGuideHint" style="margin-top: 0; margin-bottom: 14px; background: #F0FDF4; border: 1px solid #DCFCE7;">
                <div id="guideHintTitle" style="font-size: 14.5px; font-weight: 700; margin-bottom: 6px; color: #15803D;">🎉 登入同步已完成！</div>
                <div id="guideHintDesc" style="font-size: 13.5px; line-height: 1.6; color: #166534;">
                  請從螢幕底部<strong>「向上輕滑」</strong>或點擊下方按鈕切換回「甜心記帳本」App，系統已為您自動載入帳本！
                </div>
              </div>
              <a href="familyledger://auth-success?action=login&email=${encodeURIComponent(email)}" class="btn" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); text-align: center; text-decoration: none; margin-bottom: 8px;">🚀 返回「甜心記帳本」App</a>
              <button class="btn btn-secondary" onclick="tryCloseOrBack()">✕ 關閉此分頁</button>
            `;
            actionArea.style.display = 'block';
          }

          function showBindSuccess(name, email) {
            document.getElementById('statusIcon').className = 'icon-box success';
            document.getElementById('statusIcon').innerHTML = '🛡️';
            document.getElementById('statusTitle').innerText = 'Google 帳號綁定成功！';
            document.getElementById('statusDesc').innerText = '您的公帳身分稱謂已受到安全電子鎖完整保護';

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
              <div class="badge">🟢 已啟動身分防護鎖</div>
              <div class="info-card">
                <div class="info-row">
                  <span class="info-label">家庭稱謂</span>
                  <span class="info-val">${name}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">保護信箱</span>
                  <span class="info-val">${email}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">身分狀態</span>
                  <span class="info-val" style="color: #10B981;">🔒 已鎖定 (禁止未授權冒名)</span>
                </div>
              </div>
            `;

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = `
              <div class="tip-card" id="userGuideHint" style="margin-top: 0; margin-bottom: 14px; background: #F0FDF4; border: 1px solid #DCFCE7;">
                <div id="guideHintTitle" style="font-size: 14.5px; font-weight: 700; margin-bottom: 6px; color: #15803D;">🎉 雲端綁定已完成！</div>
                <div id="guideHintDesc" style="font-size: 13.5px; line-height: 1.6; color: #166534;">
                  請從螢幕底部<strong>「向上輕滑」</strong>或點擊下方按鈕切換回「甜心記帳本」App，身分防偽鎖已即時生效！
                </div>
              </div>
              <a href="familyledger://auth-success?action=bind_google&email=${encodeURIComponent(email)}" class="btn" style="text-align: center; text-decoration: none; margin-bottom: 8px;">🚀 返回「甜心記帳本」App</a>
              <button class="btn btn-secondary" onclick="tryCloseOrBack()">✕ 關閉此分頁</button>
            `;
            actionArea.style.display = 'block';
          }

          function showClaimSuccess(name, email, code) {
            document.getElementById('statusIcon').className = 'icon-box success';
            document.getElementById('statusIcon').innerHTML = '🔑';
            document.getElementById('statusTitle').innerText = '身分認領驗證成功！';
            document.getElementById('statusDesc').innerText = '已在公帳中找到您的專屬身分稱謂';

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
              <div class="info-card" style="margin-bottom: 16px;">
                <div class="info-row">
                  <span class="info-label">已辨識稱謂</span>
                  <span class="info-val">${name}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">認證信箱</span>
                  <span class="info-val">${email}</span>
                </div>
              </div>
              <div class="code-box">
                <div class="code-title">一次性認領驗證碼 (10分鐘內有效)</div>
                <div class="code-digits">${code}</div>
              </div>
            `;

            const actionArea = document.getElementById('actionArea');
            actionArea.innerHTML = `
              <div class="tip-card" id="userGuideHint" style="margin-top: 0; margin-bottom: 14px; background: #FDF2F8; border: 1px solid #FCE7F3;">
                <div id="guideHintTitle" style="font-size: 14.5px; font-weight: 700; margin-bottom: 6px; color: #BE185D;">🔑 請複製 6 位數認領碼</div>
                <div id="guideHintDesc" style="font-size: 13.5px; line-height: 1.6; color: #9D174D;">
                  請記下上方 6 位數認領碼，切換回 App 輸入即可完成身分恢復！
                </div>
              </div>
              <a href="familyledger://auth-success?action=claim&code=${code}&email=${encodeURIComponent(email)}" class="btn" style="text-align: center; text-decoration: none; margin-bottom: 8px;">🚀 返回 App 自動填入認領碼</a>
              <button class="btn btn-secondary" onclick="tryCloseOrBack()">✕ 關閉此分頁</button>
            `;
            actionArea.style.display = 'block';
          }

          handleAuth();
        } catch (initErr) {
          showError('啟動驗證服務失敗：' + (initErr.message || initErr));
        }
      }
    }
  </script>
</body>
</html>
