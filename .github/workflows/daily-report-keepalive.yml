name: Supabase Keep-Alive & Daily Report

on:
  schedule:
    # 每天台灣時間 21:18 執行 (UTC 13:18)
    # 使用冷門奇數分鐘 (:18)，大幅避開全球大量在 :00 及 :30 觸發的排程擁塞佇列
    - cron: '18 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁一鍵手動觸發測試

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Node.js 環境 (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 安裝相依套件
        run: npm install --prefer-offline --no-audit

      - name: 🧾 同步財政部發票最新中獎號碼
        run: node scripts/sync-lottery.mjs || true

      - name: 🔄 自動提交最新開獎號碼 (逢開獎日時)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/lottery_draws.json; then
            git add public/lottery_draws.json
            git commit -m "chore(lottery): 自動同步財政部最新統一發票開獎號碼 [skip ci]"
            git push origin main || true
          fi

      - name: 🚀 執行防休眠打卡與收支日報
        env:
          # Supabase 連線資訊 (優先讀取 Secrets，若未設定則自動使用專案預設值)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://babpppaxzszieropeouh.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY || 'sb_publishable_nxHZUg651sBAJ387bZgZIQ_GuEfpAuZ' }}

          # LINE 官方帳號機器人推播設定 (選填：至 GitHub Settings -> Secrets 設定即可啟用)
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID || secrets.LINE_GROUP_ID }}
          LEDGER_ID: ${{ secrets.LEDGER_ID }}
        run: node scripts/daily-report.mjs
